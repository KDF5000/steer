<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Steer · 协作会话与智能体共享</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="designbar">
      <span>组合方案 · 个人空间共享</span>
      <nav class="preview-scenes" aria-label="演示场景">
        <button data-action="collaboration">协作会话</button>
        <button data-action="agents">智能体共享</button>
      </nav>
      <select id="identity" aria-label="体验身份">
        <option value="owner">Alex · 所有者</option>
        <option value="guest">林悦 · 接收者</option>
      </select>
    </div>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main>
        <header id="topbar"></header>
        <div id="content"></div>
      </main>
      <aside id="inspector" hidden></aside>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
