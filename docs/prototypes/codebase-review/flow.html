<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Steer · 自动审查完整流程图</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><style>.flow-gallery{max-width:1800px;padding:32px;margin:auto}.flow-gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}.flow-screen{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}.flow-screen h3{padding:12px 16px;font-size:14px}.flow-screen img{width:100%;height:340px;object-fit:cover;object-position:top left;display:block}.flow-screen a{display:block}.flow-screen p{padding:12px 16px;font-size:12px;line-height:20px;color:var(--muted)}@media(max-width:760px){.flow-gallery{padding:24px 16px}.flow-gallery-grid{grid-template-columns:1fr}.flow-screen img{height:280px}}</style></head><body><header class="prototype-bar"><a href="index.html" class="title-4">返回三方案对比</a><nav class="concept-switch"><a href="?concept=a">A · 项目工作台</a><a href="?concept=b">B · 审查收件箱</a><a href="?concept=c">C · 自动化流程</a></nav></header><main class="flow-gallery"><div class="heading"><div><p class="eyebrow">完整流程 · 模拟数据</p><h1 id="title"></h1><p>点击画面查看高清原图，进入原型体验实际操作。</p></div><a class="btn primary" id="live">进入交互原型</a></div><div class="flow-gallery-grid" id="screens"></div></main><script>
const c=['a','b','c'].includes(new URLSearchParams(location.search).get('concept'))?new URLSearchParams(location.search).get('concept'):'a';const names={a:'项目工作台',b:'审查收件箱',c:'自动化流程'};document.querySelector('#title').textContent=c.toUpperCase()+' · '+names[c];document.querySelector('#live').href=c+'.html';document.querySelectorAll('.concept-switch a').forEach(a=>a.classList.toggle('active',a.search==='?concept='+c));const legacySteps=[['config','01 · 配置 Reviewer 与审查范围','选择项目、Agent 与触发方式；审查规范和流程策略分开。'],['rule','02 · 维护 Review Skill','规则可以由 Steer 维护，或从 Codebase 仓库同步。'],['publish','03 · 发布规范版本','发布后仅用于新审查，历史报告保留原版本。'],['running','04 · 执行独立审查','固定代码版本，按步骤显示执行状态。'],['report','05 · 查看报告与代码证据','区分问题、未验证推测与未执行的检查。'],['codebase','06 · 回写 Codebase MR','更新同一条汇总评论，讨论与合并继续在原平台。']];const steps=c==='c'?[['home','01 · 维护自动化流程','默认进入流程列表，查看启用状态、发布版本与规则绑定。'],['config','02 · 调整流程配置','在列表式设置中修改触发条件、Reviewer 与回写策略。'],['rules','03 · 集中维护审查规则','Review Skills 复用，Steer 维护与仓库同步各有权威来源。'],['rule-publish','04 · 发布规则版本','新任务使用已发布规范，历史报告保留原版本快照。'],['runs','05 · 自动执行与记录','Codebase 事件自动触发，运行记录用于按需追踪。'],['report','06 · 核实结果与证据','查看代码证据，回写失败可重试；讨论与合并留在 Codebase。']]:legacySteps;document.querySelector('#screens').innerHTML=steps.map(([key,title,desc])=>`<article class="flow-screen"><h3>${title}</h3><a href="previews/${c}-${key}.png" target="_blank"><img src="previews/${c}-${key}.png" alt="${title}"></a><p>${desc}</p></article>`).join('');
</script></body></html>
