<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steer · Project Session 长列表方案</title>
    <style>
      :root {
        color-scheme: light;
        --sidebar: #f7f7f8;
        --surface: #fff;
        --hover: #ececef;
        --border: #e5e5e7;
        --text: #202124;
        --secondary: #686970;
        --tertiary: #96979e;
        --accent: #5556cf;
        --accent-soft: #e8e8fa;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        color: inherit;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.75;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #8e8fe0;
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        height: 100%;
      }
      .sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
      }
      .sidebar-head {
        display: grid;
        gap: 12px;
        padding: 14px 10px 8px;
      }
      .workspace {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        padding: 3px 5px;
        text-align: left;
      }
      .workspace:hover,
      .account:hover {
        background: #ededf0;
      }
      .logo {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 9px;
        background: #2f3038;
        color: #fff;
        font-size: 13px;
        font-weight: 720;
      }
      .workspace-copy,
      .account-copy {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        line-height: 1.3;
      }
      .workspace-copy strong {
        font-size: 14px;
        font-weight: 650;
      }
      .workspace-copy small,
      .account-copy small {
        color: var(--tertiary);
        font-size: 11px;
      }
      .search {
        display: flex;
        width: 100%;
        height: 34px;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        padding: 0 9px;
        color: #83848c;
        text-align: left;
        box-shadow: 0 1px 2px #17181b08;
      }
      .search kbd {
        margin-left: auto;
        color: #a0a1a8;
        font-family: inherit;
        font-size: 11px;
      }
      .sidebar-scroll {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 1px 8px 8px;
        scrollbar-width: none;
      }
      .sidebar-scroll::-webkit-scrollbar,
      .session-scroll::-webkit-scrollbar {
        display: none;
      }
      .label {
        height: 30px;
        padding: 8px 8px 0;
        color: var(--tertiary);
        font-size: 12px;
        font-weight: 620;
        letter-spacing: 0.025em;
      }
      .new-chat {
        display: flex;
        width: 100%;
        height: 36px;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        padding: 0 9px;
        color: #686970;
        text-align: left;
        font-weight: 580;
      }
      .new-chat:hover {
        background: var(--hover);
      }
      .new-chat svg {
        width: 15px;
        height: 15px;
        color: #81828a;
      }
      .project-list {
        display: grid;
        gap: 1px;
        margin: 0;
        padding: 5px 0;
        list-style: none;
      }
      .project {
        position: relative;
      }
      .project-row {
        display: flex;
        width: 100%;
        height: 36px;
        min-width: 0;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        padding: 0 8px 0 30px;
        color: #686970;
        text-align: left;
      }
      .project-row:hover {
        background: var(--hover);
        color: #3d3e43;
      }
      .project-row svg {
        width: 15px;
        height: 15px;
        color: #81828a;
      }
      .project-name {
        min-width: 0;
        flex: 0 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .branch {
        display: inline-flex;
        min-width: 0;
        flex: 0 1 auto;
        margin-left: auto;
        align-items: center;
        gap: 3px;
        color: #96979e;
        font-size: 10px;
      }
      .branch svg {
        width: 11px;
        height: 11px;
      }
      .branch span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toggle {
        position: absolute;
        z-index: 2;
        top: 5px;
        left: 2px;
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #878890;
      }
      .toggle:hover {
        background: #dedee3;
        color: #4f5058;
      }
      .toggle svg {
        width: 13px;
        height: 13px;
        transition: transform 140ms ease;
      }
      .project.open > .toggle svg {
        transform: rotate(90deg);
      }
      .count {
        margin-left: auto;
        color: #a0a1a8;
        font-size: 11px;
      }

      .sessions {
        display: none;
        margin: 1px 0 7px 16px;
        padding: 1px 0 1px 9px;
        border-left: 1px solid #dedee2;
        list-style: none;
      }
      .project.open > .sessions {
        display: block;
      }
      .session {
        position: relative;
      }
      .session-row {
        display: flex;
        width: 100%;
        height: 34px;
        min-width: 0;
        align-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        padding: 0 30px 0 8px;
        color: #696a72;
        text-align: left;
        font-size: 13px;
      }
      .session-row:hover {
        background: var(--hover);
        color: #3d3e43;
      }
      .session-row.active {
        background: var(--accent-soft);
        color: #4c4db5;
        font-weight: 560;
      }
      .session-row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-time {
        margin-left: auto;
        padding-left: 8px;
        color: #a1a2a9;
        font-size: 10px;
        font-weight: 450;
      }
      .session-more {
        position: absolute;
        top: 4px;
        right: 2px;
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #7b7c84;
        opacity: 0;
      }
      .session:hover .session-more {
        opacity: 1;
      }
      .session-more:hover {
        background: #dedee3;
      }
      .session-more svg {
        width: 14px;
        height: 14px;
      }
      .load-more {
        display: flex;
        width: 100%;
        height: 31px;
        align-items: center;
        gap: 6px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        padding: 0 8px;
        color: #777880;
        font-size: 11px;
      }
      .load-more:hover {
        background: #ededf0;
        color: #4f5058;
      }
      .load-more svg {
        width: 12px;
        height: 12px;
      }
      .load-more span:last-child {
        margin-left: auto;
        color: #a1a2a9;
      }
      .load-more-inline span:last-child {
        margin-left: 0;
        color: inherit;
      }
      .load-more-divider {
        height: 34px;
        justify-content: center;
        gap: 7px;
        padding: 0;
        overflow: hidden;
      }
      .load-more-divider::before,
      .load-more-divider::after {
        height: 1px;
        min-width: 12px;
        flex: 1;
        background: #e1e1e5;
        content: '';
      }
      .load-more-divider:hover {
        background: transparent;
      }
      .load-more-divider:hover::before,
      .load-more-divider:hover::after {
        background: #d4d4d9;
      }
      .load-more-divider span:last-of-type {
        margin-left: 0;
        color: inherit;
      }
      .load-more-history .history-icon {
        width: 13px;
        height: 13px;
        color: #92939a;
      }
      .load-more-history .trailing-chevron {
        width: 11px;
        height: 11px;
        margin-left: auto;
        color: #a1a2a9;
      }

      .session-tools {
        display: flex;
        gap: 5px;
        padding: 5px 5px 6px 7px;
      }
      .session-filter {
        display: flex;
        min-width: 0;
        height: 30px;
        flex: 1;
        align-items: center;
        gap: 6px;
        border: 1px solid #e2e2e5;
        border-radius: 7px;
        background: #fff;
        padding: 0 7px;
        color: #94959c;
      }
      .session-filter svg {
        width: 12px;
        height: 12px;
      }
      .session-filter input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #4f5058;
        font-size: 11px;
      }
      .session-scroll {
        max-height: 272px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .scroll-fade {
        position: sticky;
        z-index: 2;
        bottom: 0;
        height: 18px;
        margin-top: -18px;
        background: linear-gradient(transparent, var(--sidebar));
        pointer-events: none;
      }

      .time-group + .time-group {
        margin-top: 3px;
      }
      .time-head {
        display: flex;
        width: 100%;
        height: 27px;
        align-items: center;
        gap: 5px;
        border: 0;
        background: transparent;
        padding: 0 7px;
        color: #96979e;
        font-size: 10px;
        font-weight: 620;
        text-align: left;
      }
      .time-head:hover {
        color: #62636a;
      }
      .time-head svg {
        width: 11px;
        height: 11px;
        transition: transform 140ms ease;
      }
      .time-group.open .time-head svg {
        transform: rotate(90deg);
      }
      .time-head span:last-child {
        margin-left: auto;
        font-weight: 450;
      }
      .time-items {
        display: none;
      }
      .time-group.open .time-items {
        display: block;
      }

      .sidebar-foot {
        border-top: 1px solid var(--border);
        padding: 9px 10px 12px;
      }
      .account {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        padding: 4px 5px;
        text-align: left;
      }
      .avatar {
        display: grid;
        width: 29px;
        height: 29px;
        place-items: center;
        border-radius: 8px;
        background: #e8e8ea;
        color: #5e6068;
        font-size: 12px;
        font-weight: 650;
      }
      .account-copy strong {
        color: #52535a;
        font-size: 12px;
        font-weight: 560;
      }

      .main {
        display: flex;
        min-width: 0;
        flex-direction: column;
        background: #fff;
      }
      .topbar {
        display: flex;
        height: 58px;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #eeeeef;
        padding: 0 18px;
      }
      .topbar strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 620;
      }
      .topbar small {
        color: #9697a0;
        font-size: 11px;
      }
      .scenario {
        display: flex;
        gap: 3px;
        margin-left: auto;
        border-radius: 10px;
        background: #f4f4f6;
        padding: 3px;
      }
      .scenario button {
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        padding: 0 11px;
        color: #696a72;
        font-size: 12px;
      }
      .scenario button:hover {
        color: var(--text);
      }
      .scenario button.active {
        background: #fff;
        color: var(--text);
        box-shadow: 0 1px 3px #18181b14;
        font-weight: 600;
      }
      .content {
        display: grid;
        min-height: 0;
        flex: 1;
        place-items: center;
        padding: 40px;
      }
      .explain {
        width: min(720px, 100%);
      }
      .eyebrow {
        color: #85868e;
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.11em;
      }
      .explain h1 {
        margin: 10px 0 10px;
        font-size: 28px;
        letter-spacing: -0.035em;
      }
      .explain > p {
        margin: 0;
        color: #6f7078;
        line-height: 1.7;
      }
      .variant-picker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      .variant-picker > span {
        color: #8a8b92;
        font-size: 11px;
        font-weight: 600;
      }
      .variant-options {
        display: flex;
        gap: 3px;
        border: 1px solid #e5e5e8;
        border-radius: 9px;
        background: #f7f7f8;
        padding: 3px;
      }
      .variant-options button {
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        padding: 0 10px;
        color: #73747c;
        font-size: 11px;
      }
      .variant-options button:hover {
        color: #3f4046;
      }
      .variant-options button.active {
        background: #fff;
        color: #44454c;
        box-shadow: 0 1px 2px #17181b12;
        font-weight: 600;
      }
      .details {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 26px;
      }
      .detail {
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 14px;
      }
      .detail strong {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
      }
      .detail span {
        color: #777880;
        font-size: 11px;
        line-height: 1.55;
      }
      .recommended {
        color: #5556cf;
      }
      .prototype-note {
        margin-top: 18px;
        color: #9a9ba2;
        font-size: 11px;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
        }
        .details {
          grid-template-columns: 1fr;
        }
        .scenario button {
          padding: 0 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="sidebar-head">
          <button class="workspace">
            <span class="logo">S</span>
            <span class="workspace-copy"
              ><strong>Steer</strong><small>Personal workspace</small></span
            >
            <svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></svg>
          </button>
          <button class="search">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            Search <kbd>⌘ K</kbd>
          </button>
        </header>
        <div class="sidebar-scroll">
          <button class="new-chat">
            <svg viewBox="0 0 24 24">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z" />
            </svg>
            New chat
          </button>
          <div class="label">Projects</div>
          <ul class="project-list">
            <li class="project open" id="primary-project">
              <button class="toggle" aria-label="Toggle project">
                <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
              </button>
              <button class="project-row">
                <svg viewBox="0 0 24 24"><path d="M3 6h5l2 2h11v10H3Z" /></svg>
                <span class="project-name">ByteStore-v2.3-077</span>
                <span class="branch"
                  ><svg viewBox="0 0 24 24">
                    <circle cx="6" cy="5" r="2" />
                    <circle cx="18" cy="6" r="2" />
                    <circle cx="6" cy="19" r="2" />
                    <path d="M6 7v10M8 9c4 0 4-3 8-3" /></svg
                  ><span>dev-v2.3</span></span
                >
              </button>
              <div class="sessions" id="sessions"></div>
            </li>
            <li class="project">
              <button class="toggle">
                <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
              </button>
              <button class="project-row">
                <svg viewBox="0 0 24 24"><path d="M3 6h5l2 2h11v10H3Z" /></svg
                ><span class="project-name">Steer</span
                ><span class="branch"><span>main</span></span>
              </button>
            </li>
            <li class="project">
              <button class="toggle">
                <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
              </button>
              <button class="project-row">
                <svg viewBox="0 0 24 24"><path d="M3 6h5l2 2h11v10H3Z" /></svg
                ><span class="project-name">Common</span
                ><span class="branch"><span>steer/55c4062</span></span>
              </button>
            </li>
          </ul>
        </div>
        <footer class="sidebar-foot">
          <button class="account">
            <span class="avatar">K</span
            ><span class="account-copy"
              ><strong>Kong Defei</strong
              ><small>kongdefei@example.com</small></span
            >
          </button>
        </footer>
      </aside>
      <main class="main">
        <header class="topbar">
          <strong>Project Session 长列表交互方案</strong>
          <small>点击左侧 Project、搜索与分组可体验交互</small>
          <nav class="scenario" aria-label="Choose方案">
            <button class="active" data-mode="recent">A · 最近优先</button>
            <button data-mode="scroll">B · 局部滚动</button>
            <button data-mode="groups">C · 时间分组</button>
          </nav>
        </header>
        <section class="content">
          <div class="explain">
            <span class="eyebrow">SESSION LIST</span>
            <h1 id="mode-title">最近会话优先</h1>
            <p id="mode-copy">
              默认展示最近 5
              条会话，当前会话始终保留；其余会话通过一行「查看全部」按需展开，最不打扰其他
              Project。
            </p>
            <div class="variant-picker" id="variant-picker">
              <span>查看全部样式</span>
              <div class="variant-options">
                <button class="active" data-more-style="inline">
                  1 · 行内提示
                </button>
                <button data-more-style="divider">2 · 分隔提示</button>
                <button data-more-style="history">3 · 更早会话</button>
              </div>
            </div>
            <div class="details" id="details"></div>
            <p class="prototype-note">
              原型仅用于确定列表交互，未修改生产代码。建议重点比较 A 和 C。
            </p>
          </div>
        </section>
      </main>
    </div>
    <script>
      const sessions = [
        ['修复 CloseChunk 触发逻辑', '10:42', 'today'],
        ['补充 smoketest 覆盖场景', '09:18', 'today'],
        ['排查 replica 长度异常', '昨天', 'week'],
        ['优化编译产物与依赖', '周日', 'week'],
        ['调整 ForceOpen 幂等行为', '周六', 'week'],
        ['分析 lease close 时序', '9 月 17 日', 'earlier'],
        ['修复 chunk 状态回退', '9 月 16 日', 'earlier'],
        ['补齐 Meta Client 测试', '9 月 15 日', 'earlier'],
        ['梳理复制流程文档', '9 月 12 日', 'earlier'],
        ['检查线上存储告警', '9 月 10 日', 'earlier'],
        ['重构 reporter 数据结构', '9 月 8 日', 'earlier'],
        ['验证冻结副本恢复', '9 月 5 日', 'earlier'],
        ['评审 v2.3 发布方案', '9 月 2 日', 'earlier'],
        ['清理历史测试夹具', '8 月 29 日', 'earlier'],
      ];
      const copy = {
        recent: {
          title: '最近会话优先',
          text: '默认展示最近 5 条会话，当前会话始终保留；其余会话通过一行「查看全部」按需展开，最不打扰其他 Project。',
          details: [
            ['优点', '侧栏高度稳定，用户最常访问的内容无需滚动。'],
            ['适合', '大多数会话只在近期继续使用的工作方式。'],
            ['注意', '较早会话需要多一次点击。'],
          ],
        },
        scroll: {
          title: 'Project 内局部滚动',
          text: 'Session 区域拥有固定最大高度，Project 标题和其他 Project 始终可见；支持项目内即时搜索，适合频繁回看大量会话。',
          details: [
            ['优点', '所有会话都在原位置，搜索与滚动效率高。'],
            ['适合', '一个 Project 长期积累且经常复用旧 Session。'],
            ['注意', '侧栏内出现第二个滚动区域，需要控制高度和滚动反馈。'],
          ],
        },
        groups: {
          title: '按时间折叠',
          text: '将会话分成今天、本周和更早；今天默认展开，本周保留展开状态，更早默认折叠，在信息密度和历史回溯之间取得平衡。',
          details: [
            ['优点', '时间语义清晰，长期 Session 也容易定位。'],
            ['适合', '会话量大且用户通常记得任务发生的大致时间。'],
            ['注意', '分组标题会增加少量视觉层级。'],
          ],
        },
      };
      const sessionsRoot = document.querySelector('#sessions');
      let mode = 'recent';
      let showAll = false;
      let moreStyle = 'inline';

      const iconMore =
        '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
      const sessionRow = (item, index) =>
        `<div class="session" data-title="${item[0].toLowerCase()}"><button class="session-row ${index === 0 ? 'active' : ''}"><span>${item[0]}</span><small class="session-time">${item[1]}</small></button><button class="session-more" aria-label="Session actions">${iconMore}</button></div>`;

      function renderRecent() {
        const visible = showAll ? sessions : sessions.slice(0, 5);
        const remaining = sessions.length - 5;
        const controls = {
          inline: showAll
            ? `<button class="load-more load-more-inline" id="load-more"><svg viewBox="0 0 24 24"><path d="m8 14 4-4 4 4"/></svg><span>收起旧会话</span></button>`
            : `<button class="load-more load-more-inline" id="load-more"><svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg><span>再显示 ${remaining} 条</span></button>`,
          divider: showAll
            ? `<button class="load-more load-more-divider" id="load-more"><span>收起旧会话</span><svg viewBox="0 0 24 24"><path d="m8 14 4-4 4 4"/></svg></button>`
            : `<button class="load-more load-more-divider" id="load-more"><span>查看其余 ${remaining} 条</span><svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg></button>`,
          history: showAll
            ? `<button class="load-more load-more-history" id="load-more"><svg class="history-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>收起较早会话</span><svg class="trailing-chevron" viewBox="0 0 24 24"><path d="m8 14 4-4 4 4"/></svg></button>`
            : `<button class="load-more load-more-history" id="load-more"><svg class="history-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>${remaining} 个更早会话</span><svg class="trailing-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>`,
        };
        sessionsRoot.innerHTML =
          visible.map(sessionRow).join('') + controls[moreStyle];
        document.querySelector('#load-more').onclick = () => {
          showAll = !showAll;
          renderRecent();
        };
      }
      function renderScroll() {
        sessionsRoot.innerHTML = `<div class="session-tools"><label class="session-filter"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="session-filter" placeholder="搜索当前 Project" /></label></div><div class="session-scroll" id="session-scroll">${sessions.map(sessionRow).join('')}<div class="scroll-fade"></div></div>`;
        const input = document.querySelector('#session-filter');
        input.oninput = () => {
          const value = input.value.trim().toLowerCase();
          document
            .querySelectorAll('#session-scroll .session')
            .forEach((row) =>
              row.classList.toggle(
                'hidden',
                !row.dataset.title.includes(value),
              ),
            );
        };
      }
      function groupBlock(label, key, open) {
        const items = sessions
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => item[2] === key);
        return `<section class="time-group ${open ? 'open' : ''}"><button class="time-head"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span>${label}</span><span>${items.length}</span></button><div class="time-items">${items.map(({ item, index }) => sessionRow(item, index)).join('')}</div></section>`;
      }
      function renderGroups() {
        sessionsRoot.innerHTML =
          groupBlock('今天', 'today', true) +
          groupBlock('本周', 'week', true) +
          groupBlock('更早', 'earlier', false);
        document
          .querySelectorAll('.time-head')
          .forEach(
            (button) =>
              (button.onclick = () =>
                button.parentElement.classList.toggle('open')),
          );
      }
      function render() {
        const data = copy[mode];
        document.querySelector('#mode-title').textContent = data.title;
        document.querySelector('#mode-copy').textContent = data.text;
        document
          .querySelector('#variant-picker')
          .classList.toggle('hidden', mode !== 'recent');
        document.querySelector('#details').innerHTML = data.details
          .map(
            ([title, text], index) =>
              `<div class="detail"><strong class="${mode === 'recent' && index === 0 ? 'recommended' : ''}">${title}</strong><span>${text}</span></div>`,
          )
          .join('');
        if (mode === 'recent') renderRecent();
        if (mode === 'scroll') renderScroll();
        if (mode === 'groups') renderGroups();
      }
      document.querySelectorAll('.scenario button').forEach(
        (button) =>
          (button.onclick = () => {
            mode = button.dataset.mode;
            showAll = false;
            document
              .querySelectorAll('.scenario button')
              .forEach((item) =>
                item.classList.toggle('active', item === button),
              );
            render();
          }),
      );
      document.querySelectorAll('[data-more-style]').forEach(
        (button) =>
          (button.onclick = () => {
            moreStyle = button.dataset.moreStyle;
            document
              .querySelectorAll('[data-more-style]')
              .forEach((item) =>
                item.classList.toggle('active', item === button),
              );
            renderRecent();
          }),
      );
      document
        .querySelectorAll('.project > .toggle')
        .forEach(
          (button) =>
            (button.onclick = () =>
              button.parentElement.classList.toggle('open')),
        );
      render();
    </script>
  </body>
</html>
