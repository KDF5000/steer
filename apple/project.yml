name: SteerApple
options:
  bundleIdPrefix: com.steer
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    STEER_BUNDLE_PREFIX: com.example.steer
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: '0.1.0'
targets:
  SteerPhone:
    type: application
    platform: iOS
    sources:
      - Phone
      - Shared
      - path: .cache/asr/ggml-tiny-q5_1.bin
        buildPhase: resources
      - path: .cache/asr/ggml-base-q5_1.bin
        buildPhase: resources
      - path: .cache/asr/WHISPER-LICENSE.txt
        buildPhase: resources
      - path: Native/WHISPER-MODEL-LICENSE.txt
        buildPhase: resources
    info:
      path: Phone/Info.plist
      properties:
        NSSpeechRecognitionUsageDescription: 将配对 Apple Watch 的录音转为文字，用于确认后继续 Steer 任务。
        NSAppTransportSecurity:
          # Do not add NSAllowsLocalNetworking: its presence makes iOS ignore
          # NSAllowsArbitraryLoads. User-configured HTTP servers need this flag.
          NSAllowsArbitraryLoads: true
    dependencies:
      - target: SteerWatch
      - framework: .cache/asr/SteerLocalASR.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STEER_BUNDLE_PREFIX).phone
        INFOPLIST_KEY_CFBundleDisplayName: Steer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网中的 Steer Server。
        TARGETED_DEVICE_FAMILY: '1,2'
  SteerWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - path: .cache/asr/ggml-tiny-q5_1.bin
        buildPhase: resources
      - path: .cache/asr/ggml-base-q5_1.bin
        buildPhase: resources
      - path: .cache/asr/WHISPER-LICENSE.txt
        buildPhase: resources
      - path: Native/WHISPER-MODEL-LICENSE.txt
        buildPhase: resources
    dependencies:
      - framework: .cache/asr/SteerLocalASR.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: libc++.tbd
    entitlements:
      path: Watch/SteerWatch.entitlements
      properties:
        aps-environment: $(STEER_APNS_ENVIRONMENT)
    settings:
      configs:
        Debug:
          STEER_APNS_ENVIRONMENT: development
        Release:
          STEER_APNS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STEER_BUNDLE_PREFIX).phone.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Steer
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(STEER_BUNDLE_PREFIX).phone
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网中的 Steer Server。
    info:
      path: Watch/Info.plist
      properties:
        NSMicrophoneUsageDescription: 录制你的语音要求，转为文字后由你确认发送给 Agent。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  SteerCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Shared
        excludes: [Pairing.swift, SecureStore.swift, PhoneSpeech.swift, LocalSpeech.swift, ModernPhoneSpeech.swift, TaskModel.swift, ResultSpeech.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STEER_BUNDLE_PREFIX).coretests
schemes:
  SteerPhone:
    build:
      targets:
        SteerPhone: all
    test:
      targets: [SteerCoreTests]
  SteerWatch:
    build:
      targets:
        SteerWatch: all
